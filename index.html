<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2355d5"><title>AI 語音待辦提醒系統</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232355d5'/%3E%3Cpath d='m8 16 5 5 11-12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="parser.js" defer></script><script src="app.js" defer></script></head>
<body><main><header><span class="brand">VOICE TASK REMINDER</span><h1>AI 語音待辦提醒系統</h1><p>把想做的事說出來，安排好每一天。</p></header><section class="composer" aria-labelledby="input-title"><h2 id="input-title">新增待辦</h2><form id="task-form"><label for="task-input">待辦事項與提醒時間</label><div class="input-row"><input id="task-input" placeholder="請輸入待辦事項" autocomplete="off" required maxlength="1000"><button type="button" id="voice-button" class="secondary">語音輸入</button></div><p id="speech-status" class="hint" role="status"></p><div id="preview" class="preview" aria-live="polite">試試「十分鐘後提醒我喝水」</div><button class="primary" type="submit">新增任務</button><p id="message" role="status"></p></form></section><div class="list-heading"><h2>我的任務</h2><span id="total"></span></div><div id="task-sections"></div><footer>資料保存在此瀏覽器。到期狀態會在開啟頁面時更新；本 App 不會發送背景通知。</footer></main></body></html>
